<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CSi | CoFre Sistemas Informáticos{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- ============================
     Navbar común a todas las páginas
     ============================ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="{{ url_for('index') }}">CSi</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('productos') }}">Productos</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('proveedores') }}">Proveedores</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('facturacion') }}">Facturación</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contacto">Contacto</a></li>
</ul>
</div>
</div>
</nav>

<!-- ============================
     Bloque de contenido dinámico: cada página hija lo sobrescribe
     con {% extends "base.html" %} y {% block content %} ... {% endblock %}
     ============================ -->
<main>
{% block content %}{% endblock %}
</main>

<!-- ============================
     Footer común a todas las páginas
     ============================ -->
<footer class="text-center">
<p>© 2026 CSi - CoFre Sistemas Informáticos</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
